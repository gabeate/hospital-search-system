<!DOCTYPE html>

<title>Create Account</title>

<body>
<h1>Create an Account</h1>
<form method="post" action="rest/accounts/addAccount">
	<label> Name: <INPUT type="text" name="name" size="20"/></label><br/>
	<label> E-mail: <INPUT type="email" name="email" size="20"/></label><br/>

	<input type="reset" name="bcancel" value="Cancel"/>
</form>
</body>
